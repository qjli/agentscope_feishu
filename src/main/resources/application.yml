server:
  port: 8080

agentscope:
  feishu:
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    verification-token: ${FEISHU_VERIFICATION_TOKEN:}
    encrypt-key: ${FEISHU_ENCRYPT_KEY:}
    session-dir: ""
    idempotency-ttl-seconds: 600
  model:
    dashscope-api-key: ${AGENTSCOPE_MODEL_DASHSCOPE_API_KEY:}
    name: ${AGENTSCOPE_MODEL_NAME:qwen-turbo}

logging:
  level:
    root: INFO
    io.agentscope.feishu: DEBUG
